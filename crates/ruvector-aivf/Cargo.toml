[package]
name        = "ruvector-aivf"
version     = "0.1.0"
edition     = "2021"
description = "AIVF — Adaptive IVF with online partition split/merge for streaming vector search workloads"
authors     = ["ruvnet", "claude-flow"]
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/ruvnet/ruvector"
keywords    = ["ann", "ivf", "vector-search", "streaming", "ruvector"]
categories  = ["algorithms", "data-structures"]

[[bin]]
name = "aivf-demo"
path = "src/main.rs"

[dependencies]
rand        = "0.8"

[dev-dependencies]
rand        = "0.8"
