[package]
name = "ruvector-learned-termination"
version = "0.1.0"
edition = "2021"
description = "Learned early termination for HNSW-style beam search: a tiny logistic regressor over cheap runtime features (best-distance, distance-improvement rate, steps taken) predicts whether continuing beam expansion will improve top-k, delivering FLOP savings at bounded recall loss"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/ruvector"
keywords = ["ann", "hnsw", "learned", "vector-search", "termination"]
categories = ["algorithms", "data-structures"]

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[profile.release]
opt-level = 3
lto = "thin"
