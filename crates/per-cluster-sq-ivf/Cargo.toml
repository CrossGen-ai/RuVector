[package]
name = "per-cluster-sq-ivf"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Per-cluster 4-bit scalar quantization for IVF indexes"
publish = false

[workspace]

[dependencies]
rand = "0.8"
rand_chacha = "0.3"

[[bin]]
name = "pcsq-bench"
path = "src/bin/bench.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
