[package]
name = "ruvector-gorder"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cache-aware node reordering for HNSW-style graphs (Gorder, BFS, RCM). Real cargo-run benchmarks."

[dependencies]
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]

[[example]]
name = "bench_layouts"
path = "examples/bench_layouts.rs"

[[bench]]
name = "search_bench"
path = "benches/search_bench.rs"
harness = false
