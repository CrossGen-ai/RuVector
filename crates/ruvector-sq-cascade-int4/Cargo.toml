[workspace]

[package]
name = "ruvector-sq-cascade-int4"
version = "0.1.0"
edition = "2021"
description = "Cascaded int8 + int4-residual scalar quantization for ~12-bit precision ANN"
license = "MIT OR Apache-2.0"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "quant_bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
