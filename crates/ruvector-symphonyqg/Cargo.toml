[package]
name        = "ruvector-symphonyqg"
version     = "0.1.0"
edition     = "2021"
description = "SymphonyQG: unified small-world graph + RaBitQ-style 1-bit quantized distance traversal with full-precision re-ranking"
authors     = ["ruvnet", "claude-flow"]
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/ruvnet/ruvector"
keywords    = ["ann", "vector-search", "quantization", "graph", "ruvector"]
categories  = ["algorithms", "data-structures"]

[[bin]]
name = "symphonyqg-demo"
path = "src/main.rs"

[dependencies]
rand = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "symphonyqg_bench"
harness = false
