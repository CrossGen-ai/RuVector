[package]
name = "ruvector-laet"
version = "0.1.0"
edition = "2021"
description = "Learned Adaptive Early Termination for HNSW — per-query stopping predicate"
license = "MIT OR Apache-2.0"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[[example]]
name = "run_bench"
path = "examples/run_bench.rs"
