[package]
name = "ruvector-rcm-hnsw"
version = "0.1.0"
edition = "2021"
publish = false
description = "Reverse Cuthill-McKee reordering of HNSW layer-0 graphs for cache-locality wins during ANN search."

[dependencies]
rand = "0.8"
rand_pcg = "0.3"

[[bin]]
name = "rcm-hnsw-bench"
path = "src/bin/bench.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
