[package]
name = "ruvector-hubness-rerank"
version = "0.1.0"
edition = "2021"
authors = ["ruvector nightly research"]
license = "Apache-2.0"
description = "Hubness-aware reranking (Mutual Proximity / Local Scaling / NICDM) for high-dimensional ANN. Corrects hub / anti-hub bias in kNN retrieval without retraining the index."
readme = "README.md"
keywords = ["vector-search", "ann", "hubness", "rerank", "knn"]
categories = ["algorithms", "data-structures"]

# Detach from parent workspace so this crate builds standalone.
[workspace]

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[dependencies]
rand = "0.8"
rand_distr = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[lints.rust]
dead_code = "allow"
unused_variables = "allow"
