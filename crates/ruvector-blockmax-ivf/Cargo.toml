[package]
name = "ruvector-blockmax-ivf"
version = "0.1.0"
edition = "2021"
description = "Block-Max scan for IVF-PQ posting lists — port of Block-Max WAND from IR to vector search."
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
rand = "0.8"
rand_chacha = "0.3"

[[example]]
name = "bench"
path = "examples/bench.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
