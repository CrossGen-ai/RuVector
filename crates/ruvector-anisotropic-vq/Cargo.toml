[package]
name        = "ruvector-anisotropic-vq"
version     = "0.1.0"
edition     = "2021"
description = "Anisotropic Vector Quantization (ScaNN-style loss-aware PQ) for ruvector"
authors     = ["ruvnet", "claude-flow"]
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/ruvnet/ruvector"
keywords    = ["ann", "quantization", "vector-search", "scann", "anisotropic"]
categories  = ["algorithms", "data-structures"]

[[bin]]
name = "avq-demo"
path = "src/main.rs"

[dependencies]
rand = "0.8"

[lib]
name = "ruvector_anisotropic_vq"
path = "src/lib.rs"
