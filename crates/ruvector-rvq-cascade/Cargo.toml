[workspace]

[package]
name = "ruvector-rvq-cascade"
version = "0.1.0"
edition = "2021"
description = "Residual Vector Quantization cascade rerank for IVF-ADC pipelines"
license = "MIT OR Apache-2.0"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
