[package]
name = "ruvector-pq-fastscan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "PQ FastScan: 4-bit Product Quantization with SIMD shuffle ADC for high-throughput ANN scan (NEON / scalar fallback)"

[lib]
name = "ruvector_pq_fastscan"
path = "src/lib.rs"

[[bin]]
name = "pq-fastscan-demo"
path = "src/main.rs"

[[bench]]
name = "fastscan_bench"
harness = false

[dependencies]
rand = { workspace = true }
rand_distr = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
