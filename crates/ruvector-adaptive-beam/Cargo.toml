[package]
name = "ruvector-adaptive-beam"
version = "0.1.0"
edition = "2021"
description = "Anytime ANN: adaptive-beam HNSW with online quantile-based early termination."
license = "MIT OR Apache-2.0"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"

[[bin]]
name = "adaptive-beam-bench"
path = "src/bin/bench.rs"

[[example]]
name = "demo"
path = "examples/demo.rs"

[lib]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
