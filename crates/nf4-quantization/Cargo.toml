[package]
name = "nf4-quantization"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "NF4 (NormalFloat-4) quantization for ANN search: 4-bit quantile-based codebooks derived from the standard normal CDF, inspired by QLoRA (Dettmers et al., 2023)."

[dependencies]
rand = "0.8"
rand_distr = "0.4"

[[bench]]
name = "nf4_bench"
path = "benches/nf4_bench.rs"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
