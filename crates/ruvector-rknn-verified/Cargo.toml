[package]
name = "ruvector-rknn-verified"
version = "0.1.0"
edition = "2021"
description = "Reverse-KNN Verified Retrieval: post-hoc precision filter that keeps only candidates whose own top-K neighborhood contains the query, with an optional pre-built reverse-KNN cache"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/ruvector"
keywords = ["ann", "rknn", "vector-search", "precision", "agent-memory"]
categories = ["algorithms", "data-structures"]

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[profile.release]
opt-level = 3
lto = "thin"
