[workspace]

[package]
name = "ruvector-bcps"
version = "0.1.0"
edition = "2021"
description = "Binary centroid probe shortlist: SIMD-popcount probe selection for IVF"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "probe_select"
harness = false

[[example]]
name = "demo"
path = "examples/demo.rs"

[profile.release]
lto = "thin"
codegen-units = 1
