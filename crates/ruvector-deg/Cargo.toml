[package]
name        = "ruvector-deg"
version     = "0.1.0"
edition     = "2021"
description = "DEG (Dynamic Exploration Graph): single-layer ANN graph with RNG edge optimization — ruvector nightly research"
authors     = ["ruvnet", "crossgen-ai", "claude-nightly"]
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/ruvnet/ruvector"
keywords    = ["ann", "graph", "vector-search", "nearest-neighbor", "ruvector"]
categories  = ["algorithms", "data-structures"]

[[bin]]
name = "deg-demo"
path = "src/main.rs"

[dependencies]
rand        = "0.8"
serde       = { version = "1", features = ["derive"] }

[dev-dependencies]
criterion   = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "deg_bench"
harness = false
