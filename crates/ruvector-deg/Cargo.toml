[package]
name = "ruvector-deg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Dynamic Exploration Graph (DEG): bounded-degree proximity graph with online insert/delete and continuous edge refinement for streaming ANN workloads"

[[bin]]
name = "deg-demo"
