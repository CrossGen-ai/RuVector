[package]
name = "ruvector-ivf-radial-head-tail"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "IVF with radial head-tail scalar quantization: intra-cell heterogeneous bit depth."

[dependencies]
rand = "0.8"
rand_pcg = "0.3"

[[bench]]
name = "rht_bench"
harness = false

[[example]]
name = "rht_demo"
path = "examples/rht_demo.rs"

[profile.release]
opt-level = 3
lto = "thin"
