[package]
name        = "ruvector-roargraph"
version     = "0.1.0"
edition     = "2021"
description = "RoarGraph: Projected bipartite graph for OOD cross-modal ANNS (VLDB 2024)"
authors     = ["ruvnet", "claude-flow"]
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/ruvnet/ruvector"
keywords    = ["ann", "graph", "vector-search", "nearest-neighbor", "ood"]
categories  = ["algorithms", "data-structures"]

[[bin]]
name = "roargraph-demo"
path = "src/main.rs"

[dependencies]
rand  = "0.8"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "roargraph_bench"
harness = false
