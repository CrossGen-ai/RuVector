[package]
name = "ruvector-roargraph"
version = "0.1.0"
edition = "2021"
description = "RoarGraph — projected bipartite graph index for cross-modal / OOD-aware approximate nearest-neighbour search"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/RuVector"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ruvector-roargraph-bench"
path = "src/bin/bench.rs"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"

[dev-dependencies]
rand = "0.8"
rand_chacha = "0.3"

[features]
default = []
