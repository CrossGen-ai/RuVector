[package]
name = "ruvector-ivf-centroid-locality-reorder"
version = "0.1.0"
edition = "2021"
description = "IVF centroid locality reordering: permute cluster IDs by a greedy nearest-neighbor chain so sequential probes land in adjacent memory, improving L1/L2 cache locality on probe-list scans."
license = "MIT OR Apache-2.0"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace]
