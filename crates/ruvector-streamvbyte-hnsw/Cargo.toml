[package]
name = "ruvector-streamvbyte-hnsw"
version = "0.1.0"
edition = "2021"
description = "StreamVByte delta encoding for HNSW adjacency with SIMD-friendly decode"
license = "MIT OR Apache-2.0"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "svb_bench"
harness = false

[[bin]]
name = "svb-demo"
path = "src/bin/demo.rs"

[profile.release]
opt-level = 3
lto = "thin"
