[package]
name        = "ruvector-nndescent"
version     = "0.1.0"
edition     = "2021"
description = "NN-Descent: approximate k-NN graph construction via local-join refinement (Dong et al. 2011) — ruvector nightly research"
authors     = ["ruvnet", "claude-flow"]
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/ruvnet/ruvector"
keywords    = ["ann", "knn-graph", "nn-descent", "vector-search", "ruvector"]
categories  = ["algorithms", "data-structures"]

[[bin]]
name = "nndescent-demo"
path = "src/main.rs"

[dependencies]
rand        = "0.8"

[dev-dependencies]
criterion   = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "nndescent_bench"
harness = false
