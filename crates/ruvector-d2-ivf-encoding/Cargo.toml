[package]
name = "ruvector-d2-ivf-encoding"
version = "0.1.0"
edition = "2021"
description = "D2-IVF: delta-of-delta encoding for IVF posting-list IDs after Hilbert-locality reorder. Compares raw u32, varint-delta, and delta-of-delta against a shared IVF layout; measures bytes/ID and decode throughput with real cargo bench numbers."
license = "MIT OR Apache-2.0"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace]
