[package]
name = "ruvector-rvq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Residual Vector Quantization (multi-stage RVQ) for compact vector storage and fast approximate nearest-neighbor search with pluggable stage counts"

[[bin]]
name = "rvq-demo"
path = "src/main.rs"

[[bench]]
name = "rvq_bench"
harness = false

[[example]]
name = "rvq_recall"
path = "examples/rvq_recall.rs"

[dependencies]
rand = { workspace = true }
rand_distr = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
