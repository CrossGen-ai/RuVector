[package]
name = "ruvector-ef-ivf-posting"
version = "0.1.0"
edition = "2021"
description = "Elias-Fano compressed IVF posting lists — 2-4x memory reduction with fast sequential decode"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
rand = "0.8"
rand_chacha = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
