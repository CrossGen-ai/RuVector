[package]
name = "ruvector-fused-rabitq-residual"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
authors = ["CrossGen-AI Nightly Research <ap@crossgen-ai.com>"]
repository = "https://github.com/CrossGen-ai/RuVector"
description = "Fused two-stage quantization: RaBitQ 1-bit coarse code + 4-bit scalar residual for ~5 bits/dim with SIMD-friendly asymmetric scan"
autoexamples = false

[[bin]]
name = "fused-rq-demo"
path = "examples/demo.rs"

[[bench]]
name = "fused_rq_bench"
harness = false

[dependencies]
rand = "0.8"
rand_distr = "0.4"

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace]
