[package]
name        = "ruvector-spann"
version     = "0.1.0"
edition     = "2021"
description = "SPANN-style boundary-aware closure assignment for IVF posting-list ANN search"
authors     = ["ruvnet", "claude-flow"]
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/ruvnet/ruvector"
keywords    = ["ann", "ivf", "spann", "vector-search", "ruvector"]
categories  = ["algorithms", "data-structures"]

[[bin]]
name = "spann-demo"
path = "src/main.rs"

[dependencies]
rand        = "0.8"

[dev-dependencies]
criterion   = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "spann_bench"
harness = false
