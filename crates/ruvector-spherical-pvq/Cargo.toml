[workspace]

[package]
name = "ruvector-spherical-pvq"
version = "0.1.0"
edition = "2021"
description = "Pyramid Vector Quantization (spherical lattice codes) for unit-norm ANN"
license = "MIT OR Apache-2.0"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "pvq_bench"
harness = false

[[bin]]
name = "pvq-demo"
path = "src/bin/demo.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
